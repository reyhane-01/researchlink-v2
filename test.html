const PERSIAN_MONTHS = [

function toFaDigits(v) {
  const map = {
    "0":"۰",
    "1":"۱",
    "2":"۲",
    "3":"۳",
    "4":"۴",
    "5":"۵",
    "6":"۶",
    "7":"۷",
    "8":"۸",
    "9":"۹"
  };

  return String(v).replace(/[0-9]/g, (d) => map[d]);
}

function toEnglishDigits(value) {
  const fa = "۰۱۲۳۴۵۶۷۸۹";
  const ar = "٠١٢٣٤٥٦٧٨٩";

  return String(value)
    .replace(/[۰-۹]/g, (d) => fa.indexOf(d))
    .replace(/[٠-٩]/g, (d) => ar.indexOf(d));
}


/*
  استفاده از تقویم فارسی خود مرورگر.
  بنابراین نیازی به API یا بک‌اند برای تاریخ نداریم.
*/
const persianDateFormatter = new Intl.DateTimeFormat(
  "fa-IR-u-ca-persian",
  {
    year: "numeric",
    month: "numeric",
    day: "numeric"
  }
);


function getPersianDateParts(date) {

  const parts = persianDateFormatter.formatToParts(date);

  const get = (type) => {

    const part = parts.find(
      (p) => p.type === type
    );

    return Number(
      toEnglishDigits(part?.value || "0")
    );
  };

  return {
    year: get("year"),
    month: get("month"),
    day: get("day")
  };
}


/*
  پیدا کردن روز اول ماه شمسی
*/
function startOfPersianMonth(date) {

  const d = new Date(date);

  d.setHours(12, 0, 0, 0);

  while (
    getPersianDateParts(d).day !== 1
  ) {
    d.setDate(d.getDate() - 1);
  }

  return d;
}


/*
  ساخت روزهای ماه شمسی
*/
function buildPersianCalendar(startDate) {

  const firstDay = new Date(startDate);

  const monthInfo =
    getPersianDateParts(firstDay);


  /*
    JavaScript:
    Sunday = 0
    Monday = 1
    ...
    Saturday = 6

    تقویم فارسی از شنبه شروع می‌شود.
  */
  const offset =
    (firstDay.getDay() + 1) % 7;


  const days = [];


  // خانه‌های خالی قبل از روز اول ماه
  for (let i = 0; i < offset; i++) {

    days.push(null);

  }


  const d = new Date(firstDay);


  while (true) {

    const info =
      getPersianDateParts(d);


    // وقتی وارد ماه بعد شدیم، تمام
    // روزهای ماه فعلی ساخته شده‌اند.
    if (
      info.year !== monthInfo.year ||
      info.month !== monthInfo.month
    ) {
      break;
    }


    days.push({
      day: info.day,
      year: info.year,
      month: info.month,
      date: new Date(d)
    });


    d.setDate(
      d.getDate() + 1
    );
  }


  return days;
}

/* =========================================================
   Matching Logic
   ========================================================= */

function matchStudentToProject(student, project) {

  const reasons = [];

  let score = 0;
  let max = 0;


  max += 40;

  if (
    student.interests.includes(project.field)
  ) {

    score += 40;

    reasons.push({
      ok: true,
      label: `تناسب با علاقه شما به ${project.field}`
    });

  } else {

    reasons.push({
      ok: false,
      label: `در فهرست علایق شما نیست (${project.field})`
    });

  }


  max += 35;

  const overlap =
    project.requiredSkills.filter(
      (s) => student.skills.includes(s)
    );

  const skillScore =
    project.requiredSkills.length
      ? Math.round(
          (overlap.length /
            project.requiredSkills.length) *
            35
        )
      : 0;

  score += skillScore;


  if (overlap.length > 0) {

    reasons.push({
      ok: true,
      label:
        `${toFaDigits(overlap.length)} مهارت مشترک: ${overlap.join('، ')}`
    });

  } else {

    reasons.push({
      ok: false,
      label: "هیچ مهارت مشترکی وجود ندارد"
    });

  }


  max += 15;

  if (
    student.availability === project.time
  ) {

    score += 15;

    reasons.push({
      ok: true,
      label: "زمان در دسترس با نیاز پروژه تطبیق دارد"
    });

  } else {

    reasons.push({
      ok: false,
      label: "زمان در دسترس با پروژه متفاوت است"
    });

  }


  max += 10;

  if (
    student.level === project.level
  ) {

    score += 10;

    reasons.push({
      ok: true,
      label: "سطح تحصیلی با نیاز پروژه تطبیق دارد"
    });

  } else {

    reasons.push({
      ok: false,
      label: `سطح ترجیحی: ${project.level}`
    });

  }


  return {
    percent: Math.round((score / max) * 100),
    reasons
  };
}


function statusBadgeClass(status) {

  if (
    ["باز", "پذیرفته‌شده", "فهرست کوتاه"]
      .includes(status)
  ) {
    return "badge-success";
  }

  if (
    ["در حال بررسی", "ارسال‌شده"]
      .includes(status)
  ) {
    return "badge-cyan";
  }

  if (
    ["رد شده", "بسته"]
      .includes(status)
  ) {
    return "badge-danger";
  }

  return "badge-neutral";
}

function EmptyState({
  title,
  body,
  cta,
  onClick
}) {

  return (
    <div className="empty-state">

      <div className="empty-title">

      </div>

      <div className="empty-body">
        {body}
      </div>

      {cta && (
        <button

        >

function Chip({
  label,
  active,
  onClick
}) {

  return (
    <button
      type="button"
      className={`chip${active ? " active" : ""}`}
      onClick={onClick}
    >

function Field({

}) {

  return (
    <label className="field">

/* =========================================================
   Landing
   ========================================================= */

function Landing({ go }) {

  /* ---------- Real Persian Calendar State ---------- */

  const [now, setNow] =
    useState(() => new Date());


  const [calendarDate, setCalendarDate] =
    useState(() =>
      startOfPersianMonth(new Date())
    );


  const [selectedDate, setSelectedDate] =
    useState(null);


  /*
    اگر کاربر خودش ماه را تغییر نداده باشد،
    تقویم همیشه روی ماه جاری باقی می‌ماند.
  */
  const [followToday, setFollowToday] =
    useState(true);


  /*
    هر یک دقیقه تاریخ سیستم بررسی می‌شود.
    بنابراین اگر صفحه باز بماند،
    روز فعلی هم به‌روزرسانی می‌شود.
  */
  useEffect(() => {

    const timer = setInterval(() => {

      const current = new Date();

      setNow(current);

      if (followToday) {

        setCalendarDate(
          startOfPersianMonth(current)
        );

      }

    }, 60000);


    return () => clearInterval(timer);

  }, [followToday]);


  const today =
    getPersianDateParts(now);


  const view =
    getPersianDateParts(calendarDate);


  const calendarDays =
    buildPersianCalendar(calendarDate);


  function changeMonth(direction) {

    setFollowToday(false);

    const probe =
      new Date(calendarDate);


    if (direction === 1) {

      /*
        به اندازه کافی جلو می‌رویم تا
        حتماً وارد ماه بعد شده باشیم.
      */
      probe.setDate(
        probe.getDate() + 35
      );

    } else {

      /*
        یک روز عقب می‌رویم و سپس
        روز اول ماه قبل را پیدا می‌کنیم.
      */
      probe.setDate(
        probe.getDate() - 1
      );

    }


    setCalendarDate(
      startOfPersianMonth(probe)
    );

    setSelectedDate(null);
  }


  return (

    <div>

      {/* =================================================
          HEADER
          ================================================= */}

      <header className="topbar">

        <Logo
          onClick={() => go("landing")}
        />

        <nav
          className="topnav"
          aria-label="ناوبری اصلی"
        >

          <a
            className="active"
            href="#top"
          >
            خانه
          </a>

          <a href="#professors">
            اساتید
          </a>

          <a href="#opportunities">
            فرصت‌های پژوهشی
          </a>

          <a href="#events">
            رویدادها
          </a>

          <a href="#faq">
            راهنما
          </a>

        </nav>


        <div className="header-actions">

          <label
            className="search"

          >

            <Icon
              path={ICONS.search}
              size={17}
            />

            <input
              type="search"
              placeholder="جستجوی پژوهش، استاد..."
            />

          </label>


          <button
            className="btn btn-outline btn-sm"
            onClick={() =>
              go("auth", {
                role: "student"
              })
            }
          >
            ورود
          </button>


          <button
            className="btn btn-primary btn-sm"
            onClick={() =>
              go("auth", {
                role: "student"
              })
            }
          >
            ثبت‌نام
          </button>

        </div>

      </header>


      <main id="top">

        {/* =================================================
            PAGE INTRO
            ================================================= */}

        <div className="page-intro">

          <div>

            <div className="eyebrow">
              Research &amp; Collaboration Platform
            </div>

            <h1 className="page-title">
              شبکه پژوهش دانشگاه علوم پزشکی قم
            </h1>

            <p className="page-subtitle">

            </p>

          </div>


          <a
            className="btn btn-primary"
            href="#opportunities"
          >
            مشاهده فرصت‌های پژوهشی
          </a>

        </div>


        {/* =================================================
            HERO
            ================================================= */}

        <section
          className="hero"
          aria-label="معرفی ResearchLink"
        >

            </div>

            <h1>

/* =========================================================
   Auth
   ========================================================= */

function AuthScreen({
  go,
  initialRole,
  onLogin,
  students,
  professors,
  onCreateStudent
}) {

  const [pickedRole, setPickedRole] =
    useState(initialRole || "student");

  const [mode, setMode] =
    useState("signup");


  return (

    <div>

      <header className="topbar">

        <Logo
          onClick={() => go("landing")}
        />

        <nav className="topnav"></nav>

        <div className="header-actions"></div>

      </header>


      <main>

        <div className="auth-wrap">

          <div className="panel">

            <div className="panel-body">

              <div className="mode-toggle">

                <button
                  className={
                    mode === "signup"
                      ? "active"
                      : ""
                  }
                  onClick={() =>
                    setMode("signup")
                  }
                >
                  ثبت‌نام
                </button>

                <button
                  className={
                    mode === "login"
                      ? "active"
                      : ""
                  }
                  onClick={() =>
                    setMode("login")
                  }
                >
                  ورود
                </button>

              </div>


              <div
                style={{
                  fontSize: 13,
                  fontWeight: 700,
                  marginBottom: 10,
                  color: "var(--color-text)"
                }}
              >
                من یک:
              </div>


              <div className="role-toggle">

                {[
                  "student",
                  "professor"
                ].map((r) => (

                  <button
                    key={r}
                    className={
                      pickedRole === r
                        ? "active"
                        : ""
                    }
                    onClick={() =>
                      setPickedRole(r)
                    }
                  >
                    {
                      r === "student"
                        ? "دانشجو هستم"
                        : "استاد هستم"
                    }
                  </button>

                ))}

              </div>


              {mode === "signup" ? (

                pickedRole === "student" ? (

                  <button
                    className="btn btn-primary"
                    style={{
                      width: "100%"
                    }}
                    onClick={() =>
                      go("onboarding")
                    }
                  >
                    ادامه به تنظیم پروفایل
                  </button>

                ) : (

                  <button
                    className="btn btn-primary"
                    style={{
                      width: "100%"
                    }}
                    onClick={() =>
                      onLogin(
                        "professor",
                        professors[0].id
                      )
                    }
                  >
                    ساخت حساب نمایشی استاد
                  </button>

                )

              ) : (

                <div className="demo-list">

                  <div
                    style={{
                      fontSize: 12,
                      color: "var(--color-text-muted)",
                      marginBottom: 4
                    }}
                  >
                    ورود نمایشی — یک حساب موجود را انتخاب کنید:
                  </div>


                  {
                    (
                      pickedRole === "student"
                        ? students
                        : professors
                    ).map((u) => (

                      <button
                        key={u.id}
                        className="demo-item"
                        onClick={() =>
                          onLogin(
                            pickedRole,
                            u.id
                          )
                        }
                      >

                        <div className="demo-name">
                          {u.name}
                        </div>

                        <div className="demo-role">
                          {
                            pickedRole === "student"
                              ? u.university
                              : u.department
                          }
                        </div>

                      </button>

                    ))
                  }

                </div>

              )}

            </div>

          </div>

        </div>

      </main>

    </div>

  );
}


/* =========================================================
   Student Onboarding
   ========================================================= */

function Onboarding({
  go,
  onCreate
}) {

  const [form, setForm] =
    useState({
      name: "",
      university: "",
      major: "",
      level: LEVELS[0],
      interests: [],
      skills: [],
      availability: HOURS[1],
      bio: ""
    });


  const toggle = (
    list,
    val
  ) =>
    list.includes(val)
      ? list.filter(
          (x) => x !== val
        )
      : [...list, val];


  const valid =
    form.name &&
    form.university &&
    form.major;


  return (

    <div>

      <header className="topbar">

        <Logo
          onClick={() =>
            go("landing")
          }
        />

        <nav className="topnav"></nav>

        <div className="header-actions"></div>

      </header>


      <main>

        <div
          style={{
            maxWidth: 640,
            margin: "0 auto"
          }}
        >

          <div className="page-intro">

            <div>

              <div className="eyebrow">
                پروفایل پژوهشی
              </div>

              <h1 className="page-title">
                تنظیم پروفایل دانشجویی
              </h1>

              <p className="page-subtitle">
                این اطلاعات برای محاسبه امتیاز تطابق شما با پروژه‌ها استفاده می‌شود.
              </p>

            </div>

          </div>


          <div className="panel">

            <div className="panel-body">

              <div className="form-grid">

                <Field label="نام و نام خانوادگی">

                  <input
                    value={form.name}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        name: e.target.value
                      })
                    }
                    placeholder="مثال: زهرا محمدی"
                  />

                </Field>


                <Field label="دانشگاه">

                  <input
                    value={form.university}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        university: e.target.value
                      })
                    }
                    placeholder="دانشگاه علوم پزشکی قم"
                  />

                </Field>


                <Field label="رشته تحصیلی">

                  <input
                    value={form.major}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        major: e.target.value
                      })
                    }
                    placeholder="مثال: پزشکی"
                  />

                </Field>


                <Field label="سطح تحصیلی">

                  <select
                    value={form.level}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        level: e.target.value
                      })
                    }
                  >

                    {
                      LEVELS.map((l) => (

                        <option key={l}>
                          {l}
                        </option>

                      ))
                    }

                  </select>

                </Field>


                <Field label="زمان در دسترس">

                  <select
                    value={form.availability}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        availability: e.target.value
                      })
                    }
                  >

                    {
                      HOURS.map((h) => (

                        <option key={h}>
                          {h}
                        </option>

                      ))
                    }

                  </select>

                </Field>


                <div className="field full">

                  <label>
                    علایق پژوهشی
                  </label>

                  <div className="chip-group">

                    {
                      FIELDS.map((f) => (

                        <Chip
                          key={f}
                          label={f}
                          active={
                            form.interests.includes(f)
                          }
                          onClick={() =>
                            setForm({
                              ...form,
                              interests:
                                toggle(
                                  form.interests,
                                  f
                                )
                            })
                          }
                        />

                      ))
                    }

                  </div>

                </div>


                <div className="field full">

                  <label>
                    مهارت‌ها
                  </label>

                  <div className="chip-group">

                    {
                      SKILLS.map((s) => (

                        <Chip
                          key={s}
                          label={s}
                          active={
                            form.skills.includes(s)
                          }
                          onClick={() =>
                            setForm({
                              ...form,
                              skills:
                                toggle(
                                  form.skills,
                                  s
                                )
                            })
                          }
                        />

                      ))
                    }

                  </div>

                </div>


                <div className="field full">

                  <label>
                    معرفی کوتاه
                  </label>

                  <textarea
                    value={form.bio}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        bio: e.target.value
                      })
                    }
                    placeholder="در چند جمله خودتان را معرفی کنید..."
                  ></textarea>

                </div>

              </div>


              <div
                className="form-actions"
                style={{
                  marginTop: 14
                }}
              >

                <button
                  className="btn btn-primary"
                  disabled={!valid}
                  onClick={() =>
                    valid && onCreate(form)
                  }
                >
                  ساخت پروفایل و ورود
                </button>

              </div>

            </div>

          </div>

        </div>

      </main>

    </div>

  );
}


/* =========================================================
   Student Dashboard
   ========================================================= */

function StudentDashboard({
  go,
  header,
  student,
  projects,
  professors
}) {

  const [fieldFilter, setFieldFilter] =
    useState(null);


  const list =
    projects
      .filter(
        (p) =>
          !fieldFilter ||
          p.field === fieldFilter
      )
      .map((p) => ({
        p,
        match:
          matchStudentToProject(
            student,
            p
          )
      }))
      .sort(
        (a, b) =>
          b.match.percent -
          a.match.percent
      );


  return (

    <div>

      {header}

      <main>

        <div className="page-intro">

          <div>

            <div className="eyebrow">
              خوش آمدید، {student.name}
            </div>

            <h1 className="page-title">
              پروژه‌های پژوهشی
            </h1>

            <p className="page-subtitle">
              پروژه‌ها بر اساس بیشترین امتیاز تطابق با پروفایل شما مرتب شده‌اند.
            </p>

          </div>

        </div>


        <div className="filter-bar">

          <Chip
            label="همه حوزه‌ها"
            active={!fieldFilter}
            onClick={() =>
              setFieldFilter(null)
            }
          />

          {
            FIELDS.map((f) => (

              <Chip
                key={f}
                label={f}
                active={
                  fieldFilter === f
                }
                onClick={() =>
                  setFieldFilter(f)
                }
              />

            ))
          }

        </div>


        <div className="project-list">

          {
            list.map(
              ({
                p,
                match
              }) => {

                const prof =
                  professors.find(
                    (x) =>
                      x.id ===
                      p.professorId
                  );


                return (

                  <article
                    key={p.id}
                    className="project-card"
                    onClick={() =>
                      go(
                        "projectDetails",
                        {
                          projectId:
                            p.id
                        }
                      )
                    }
                  >

                    <div className="pc-top">

                      <div>

                        <div className="pc-title">
                          {p.title}
                        </div>

                        <div className="pc-meta">
                          {prof?.name} · {p.field}
                        </div>

                        <div className="pc-tags">

                          <Badge tone="badge-cyan">
                            {p.type}
                          </Badge>

                          <Badge tone="badge-neutral">
                            {p.time}
                          </Badge>

                          <Badge tone="badge-neutral">
                            {p.duration}
                          </Badge>

                        </div>

                      </div>


                      <ScoreRing
                        percent={
                          match.percent
                        }
                        sm
                      />

                    </div>

                  </article>

                );

              }
            )
          }


          {!list.length && (

            <EmptyState
              title="پروژه‌ای یافت نشد"
              body="فیلتر حوزه پژوهشی را تغییر دهید."
            />

          )}

        </div>

      </main>

    </div>

  );
}

function ProjectDetails({

  header,
  projectId,
  projects,
  professors,
  student,
  applications,
  onApply
}) {

  const [message, setMessage] =
    useState("");


  const project =
    projects.find(
      (p) =>
        p.id === projectId
    );


  const prof =
    professors.find(
      (p) =>
        p.id ===
        project?.professorId
    );


  const match =
    student
      ? matchStudentToProject(
          student,
          project
        )
      : null;


  const already =
    student &&
    applications.some(
      (a) =>
        a.projectId === projectId &&
        a.studentId === student.id
    );


  if (!project) {
    return null;
  }


  return (

    <div>

      {header}


      <main>

        <div
          className="back-link"
          onClick={() =>
            go("studentDashboard")
          }
        >
          → بازگشت به فهرست پروژه‌ها
        </div>


        <div className="content-grid">

          <div className="left-column">

            <section className="panel">

              <div className="panel-head">

                <div>

                  <div className="panel-title">
                    {project.title}
                  </div>

                  <div className="panel-caption">
                    {prof?.name} · {project.field}
                  </div>

                </div>

                <Badge tone="badge-success">
                  {project.status}
                </Badge>

              </div>


              <div className="panel-body">

                <p
                  style={{
                    color: "var(--color-text-secondary)",
                    fontSize: 14,
                    lineHeight: 1.9
                  }}
                >
                  {project.description}
                </p>


                <div
                  style={{
                    marginTop: 16,
                    fontWeight: 700,
                    fontSize: 14,
                    color: "var(--color-primary)"
                  }}
                >
                  سوال پژوهشی
                </div>


                <p
                  style={{
                    color: "var(--color-text-secondary)",
                    fontSize: 14,
                    marginTop: 6
                  }}
                >
                  {project.question}
                </p>


                <div
                  style={{
                    marginTop: 16,
                    fontWeight: 700,
                    fontSize: 13,
                    color: "var(--color-primary)"
                  }}
                >
                  مهارت‌های موردنیاز
                </div>


                <div
                  className="pc-tags"
                  style={{
                    marginTop: 8
                  }}
                >

                  {
                    project.requiredSkills.map(
                      (s) => (

                        <span
                          key={s}
                          className="tag"
                        >
                          {s}
                        </span>

                      )
                    )
                  }

                </div>


                <div className="hero-meta">

                  <span className="meta-pill">
                    سطح: {project.level}
                  </span>

                  <span className="meta-pill">
                    زمان: {project.time}
                  </span>

                  <span className="meta-pill">
                    مدت: {project.duration}
                  </span>

                  <span className="meta-pill">
                    اعضا: {toFaDigits(project.members)} نفر
                  </span>

                  <span className="meta-pill">
                    مهلت: {project.deadline}
                  </span>

                </div>

              </div>

            </section>

          </div>


          <aside className="right-column">

            {match && (

              <section className="panel">

                <div className="panel-head">

                  <div className="panel-title">
                    امتیاز تطابق شما
                  </div>

                  <span className="tag tag-pink">
                    Match Score
                  </span>

                </div>


                <div className="match-card">

                  <div className="match-head">

                    <div className="match-title">
                      میزان تناسب پروفایل
                    </div>

                    <ScoreRing
                      percent={
                        match.percent
                      }
                    />

                  </div>


                  <div className="reason-list">

                    {
                      match.reasons.map(
                        (r, i) => (

                          <div
                            key={i}
                            className={
                              `reason ${
                                r.ok
                                  ? "ok"
                                  : "no"
                              }`
                            }
                          >

                            <span className="reason-dot">
                              {
                                r.ok
                                  ? "✓"
                                  : "–"
                              }
                            </span>

                            {r.label}

                          </div>

                        )
                      )
                    }

                  </div>

                </div>

              </section>

            )}


            {student && (

              <section className="panel">

                <div className="panel-head">

                  <div className="panel-title">
                    درخواست همکاری
                  </div>

                </div>


                <div className="panel-body">

                  {already ? (

                    <Badge tone="badge-success">
                      درخواست شما ارسال شده است
                    </Badge>

                  ) : (

                    <div>

                      <Field label="پیام شما برای استاد">

                        <textarea
                          value={message}
                          onChange={(e) =>
                            setMessage(
                              e.target.value
                            )
                          }
                          placeholder="چرا برای این پروژه مناسب هستید؟"
                        ></textarea>

                      </Field>


                      <button
                        className="btn btn-primary"
                        style={{
                          marginTop: 10,
                          width: "100%"
                        }}
                        onClick={() => {

                          onApply(
                            project.id,
                            message
                          );

                          go(
                            "myApplications"
                          );

                        }}
                      >
                        ارسال درخواست
                      </button>

                    </div>

                  )}

                </div>

              </section>

            )}

          </aside>

        </div>

      </main>

    </div>

  );
}


/* =========================================================
   My Applications
   ========================================================= */

function MyApplications({
  go,
  header,
  student,
  applications,
  projects,
  professors
}) {

  const mine =
    applications.filter(
      (a) =>
        a.studentId === student.id
    );


  return (

    <div>

      {header}

      <main>

        <div className="page-intro">

          <div>

            <div className="eyebrow">
              پیگیری همکاری
            </div>

            <h1 className="page-title">
              درخواست‌های من
            </h1>

            <p className="page-subtitle">
              وضعیت درخواست‌های همکاری شما در پروژه‌های پژوهشی.
            </p>

          </div>

        </div>


        <div className="app-list">

          {
            mine.map((a) => {

              const project =
                projects.find(
                  (p) =>
                    p.id ===
                    a.projectId
                );


              const prof =
                professors.find(
                  (p) =>
                    p.id ===
                    project?.professorId
                );


              return (

                <article
                  key={a.id}
                  className="app-card"
                  onClick={() =>
                    go(
                      a.status ===
                        "پذیرفته‌شده"
                        ? "workspace"
                        : "projectDetails",
                      {
                        projectId:
                          a.projectId
                      }
                    )
                  }
                >

                  <div className="pc-top">

                    <div>

                      <div className="pc-title">
                        {project?.title}
                      </div>

                      <div className="pc-meta">
                        {prof?.name} · ارسال‌شده در {a.createdAt}
                      </div>

                    </div>


                    <Badge
                      tone={
                        statusBadgeClass(
                          a.status
                        )
                      }
                    >
                      {a.status}
                    </Badge>

                  </div>

                </article>

              );

            })
          }


          {!mine.length && (

            <EmptyState
              title="هنوز درخواستی ارسال نکرده‌اید"
              body="از فهرست پروژه‌ها یکی را انتخاب کنید و درخواست همکاری بفرستید."
              cta="مشاهده پروژه‌ها"
              onClick={() =>
                go("studentDashboard")
              }
            />

          )}

        </div>

      </main>

    </div>

  );
}


/* =========================================================
   Professor Dashboard
   ========================================================= */

function ProfessorDashboard({
  go,
  header,
  professor,
  projects,
  applications
}) {

  const mine =
    projects.filter(
      (p) =>
        p.professorId ===

    );


  return (

    <div>

      {header}

      <main>

        <div className="page-intro">

          <div>

            <div className="eyebrow">
              خوش آمدید، {professor.name}
            </div>

            <h1 className="page-title">
              پروژه‌های پژوهشی من
            </h1>

            <p className="page-subtitle">
              {professor.department}
            </p>

          </div>


          <button
            className="btn btn-primary"
            onClick={() =>
              go("createProject")
            }
          >
            + ایجاد پروژه جدید
          </button>

        </div>


        <div className="project-list">

          {
            mine.map((p) => {

              const appCount =
                applications.filter(
                  (a) =>
                    a.projectId ===
                    p.id
                ).length;


              return (

                <article
                  key={p.id}
                  className="project-card"
                  onClick={() =>
                    go(
                      "projectApplicants",
                      {
                        projectId:
                          p.id
                      }
                    )
                  }
                >

                  <div className="pc-top">

                    <div>

                      <div className="pc-title">
                        {p.title}
                      </div>

                      <div className="pc-meta">
                        {p.field} · {p.type}
                      </div>

                        </Badge>

          {!mine.length && (

              cta="ایجاد پروژه"
              onClick={() =>
                go("createProject")
              }
            />

          )}

        </div>

      </main>

    </div>

  );
}


/* =========================================================
   Create Project
   ========================================================= */

function CreateProject({
  go,
  header,
  professor,
  onCreate
}) {

  const [form, setForm] =
    useState({
      title: "",
      field: FIELDS[0],
      type: TYPES[0],
      description: "",
      question: "",
      requiredSkills: [],
      level: LEVELS[0],
      members: 2,
      time: HOURS[1],
      duration: DURATIONS[1],
      deadline: ""
    });


  const toggle = (
    list,
    val
  ) =>
    list.includes(val)
      ? list.filter(
          (x) => x !== val
        )
      : [...list, val];


  const valid =
    form.title &&
    form.description;


  return (

    <div>

      {header}

      <main>

        <div
          style={{
            maxWidth: 720,
            margin: "0 auto"
          }}
        >

          <div
            className="back-link"
            onClick={() =>
              go("professorDashboard")
            }
          >
            → بازگشت به داشبورد
          </div>


          <div className="page-intro">

            <div>

              <h1 className="page-title">
                ایجاد پروژه پژوهشی جدید
              </h1>

              <p className="page-subtitle">
                اطلاعات زیر به دانشجویان کمک می‌کند بهترین تصمیم را برای درخواست همکاری بگیرند.
              </p>

            </div>

          </div>


          <div className="panel">

            <div className="panel-body">

              <div className="form-grid">

                <div className="field full">

                  <label>
                    عنوان پروژه
                  </label>

                  <input
                    value={form.title}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        title:
                          e.target.value
                      })
                    }
                    placeholder="مثال: بررسی نشانگرهای زیستی..."
                  />

                </div>


                <Field label="حوزه پژوهشی">

                  <select
                    value={form.field}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        field:
                          e.target.value
                      })
                    }
                  >

                    {
                      FIELDS.map(
                        (f) => (

                          <option key={f}>
                            {f}
                          </option>

                        )
                      )
                    }

                  </select>

                </Field>


                <Field label="نوع پژوهش">

                  <select
                    value={form.type}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        type:
                          e.target.value
                      })
                    }
                  >

                    {
                      TYPES.map(
                        (t) => (

                          <option key={t}>
                            {t}
                          </option>

                        )
                      )
                    }

                  </select>

                </Field>


                <div className="field full">

                  <label>
                    توضیحات پروژه
                  </label>

                  <textarea
                    value={form.description}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        description:
                          e.target.value
                      })
                    }
                    placeholder="خلاصه‌ای از پروژه بنویسید..."
                  ></textarea>

                </div>


                <div className="field full">

                  <label>
                    سوال پژوهشی
                  </label>

                  <textarea
                    value={form.question}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        question:
                          e.target.value
                      })
                    }
                    placeholder="این پروژه به دنبال پاسخ چه سوالی است؟"
                  ></textarea>

                </div>


                <div className="field full">

                  <label>
                    مهارت‌های موردنیاز
                  </label>

                  <div className="chip-group">

                    {
                      SKILLS.map(
                        (s) => (

                          <Chip
                            key={s}
                            label={s}
                            active={
                              form.requiredSkills.includes(s)
                            }
                            onClick={() =>
                              setForm({
                                ...form,
                                requiredSkills:
                                  toggle(
                                    form.requiredSkills,
                                    s
                                  )
                              })
                            }
                          />

                        )
                      )
                    }

                  </div>

                </div>


                <Field label="سطح تحصیلی موردنیاز">

                  <select
                    value={form.level}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        level:
                          e.target.value
                      })
                    }
                  >

                    {
                      LEVELS.map(
                        (l) => (

                          <option key={l}>
                            {l}
                          </option>

                        )
                      )
                    }

                  </select>

                </Field>


                <Field label="تعداد اعضای موردنیاز">

                  <input
                    type="number"
                    min="1"
                    value={form.members}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        members:
                          Number(
                            e.target.value
                          )
                      })
                    }
                  />

                </Field>


                <Field label="زمان موردنیاز در هفته">

                  <select
                    value={form.time}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        time:
                          e.target.value
                      })
                    }
                  >

                    {
                      HOURS.map(
                        (h) => (

                          <option key={h}>
                            {h}
                          </option>

                        )
                      )
                    }

                  </select>

                </Field>


                <Field label="مدت زمان پروژه">

                  <select
                    value={form.duration}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        duration:
                          e.target.value
                      })
                    }
                  >

                    {
                      DURATIONS.map(
                        (d) => (

                          <option key={d}>
                            {d}
                          </option>

                        )
                      )
                    }

                  </select>

                </Field>


                <Field label="مهلت ارسال درخواست">

                  <input
                    type="text"
                    placeholder="۱۴۰۵/۰۸/۰۱"
                    value={form.deadline}
                    onChange={(e) =>
                      setForm({
                        ...form,
                        deadline:
                          e.target.value
                      })
                    }
                  />

                </Field>

              </div>


              <div
                className="form-actions"
                style={{
                  marginTop: 14
                }}
              >

                <button
                  className="btn btn-primary"
                  disabled={!valid}
                  onClick={() =>
                    valid &&
                    onCreate({
                      ...form,
                      professorId:
                        professor.id
                    })
                  }
                >
                  انتشار پروژه
                </button>

              </div>

            </div>

          </div>

        </div>

      </main>

    </div>

  );
}


/* =========================================================
   Project Applicants
   ========================================================= */

function ProjectApplicants({
  go,
  header,
  projectId,
  projects,
  applications,
  students,
  onStatus
}) {

  const project =
    projects.find(
      (p) =>
        p.id === projectId
    );


  const apps =
    applications
      .filter(
        (a) =>
          a.projectId === projectId
      )
      .map((a) => {

        const student =
          students.find(
            (s) =>
              s.id ===
              a.studentId
          );


        return {
          a,
          student,
          match:
            matchStudentToProject(
              student,
              project
            )
        };

      })
      .sort(
        (x, y) =>
          y.match.percent -
          x.match.percent
      );


  return (

    <div>

      {header}

      <main>

        <div
          className="back-link"
          onClick={() =>
            go("professorDashboard")
          }
        >
          → بازگشت به داشبورد
        </div>


        <div className="page-intro">

          <div>

            <h1 className="page-title">
              {project?.title}
            </h1>

            <p className="page-subtitle">
              متقاضیان ({toFaDigits(apps.length)})
            </p>

          </div>

        </div>


        <div className="applicant-list">

          {
            apps.map(
              ({
                a,
                student,
                match
              }) => (

                <article
                  key={a.id}
                  className="applicant-card"
                >

                  <div className="pc-top">

                    <div>

                      <div className="pc-title">
                        {student?.name}
                      </div>

                      <div className="pc-meta">
                        {student?.university} · {student?.level}
                      </div>

                      <p
                        style={{
                          fontSize: 13,
                          color: "var(--color-text)",
                          marginTop: 8,
                          maxWidth: 480
                        }}
                      >
                        {a.message}
                      </p>

                    </div>


                    <ScoreRing
                      percent={
                        match.percent
                      }
                    />

                  </div>


                  <div
                    className="pc-actions"
                    style={{
                      justifyContent:
                        "space-between",
                      alignItems:
                        "center"
                    }}
                  >

                    <Badge
                      tone={
                        statusBadgeClass(
                          a.status
                        )
                      }
                    >
                      {a.status}
                    </Badge>


                    <div
                      style={{
                        display: "flex",
                        gap: 8
                      }}
                    >

                      {
                        a.status !== "فهرست کوتاه" &&
                        a.status !== "پذیرفته‌شده" && (

                          <button
                            className="btn btn-outline btn-sm"
                            onClick={() =>
                              onStatus(
                                a.id,
                                "فهرست کوتاه"
                              )
                            }
                          >
                            فهرست کوتاه
                          </button>

                        )
                      }


                      {
                        a.status !== "پذیرفته‌شده" && (

                          <button
                            className="btn btn-primary btn-sm"
                            onClick={() =>
                              onStatus(
                                a.id,
                                "پذیرفته‌شده"
                              )
                            }
                          >
                            پذیرش
                          </button>

                        )
                      }


                      {
                        a.status !== "رد شده" &&
                        a.status !== "پذیرفته‌شده" && (

                          <button
                            className="btn btn-danger btn-sm"
                            onClick={() =>
                              onStatus(
                                a.id,
                                "رد شده"
                              )
                            }
                          >
                            رد
                          </button>

                        )
                      }

                    </div>

                  </div>

                </article>

              )
            )
          }


          {!apps.length && (

            <EmptyState
              title="هنوز متقاضی‌ای نیست"
              body="با ارسال درخواست دانشجویان، آن‌ها اینجا نمایش داده می‌شوند."
            />

          )}

        </div>

      </main>

    </div>

  );
}


/* =========================================================
   Workspace
   ========================================================= */

function Workspace({
  go,
  header,
  projectId,
  projects,
  professors,
  students,
  applications,
  role
}) {

  const project =
    projects.find(
      (p) =>
        p.id === projectId
    );


  const professor =
    professors.find(
      (p) =>
        p.id ===
        project?.professorId
    );


  const members =
    applications
      .filter(
        (a) =>
          a.projectId === projectId &&
          a.status === "پذیرفته‌شده"
      )
      .map(
        (a) =>
          students.find(
            (s) =>
              s.id ===
              a.studentId
          )
      );


  const [tasks, setTasks] =
    useState([
      {
        id: "t1",
        title: "تکمیل جست‌وجوی متون",
        assignee:
          members[0]?.name ||
          "تعیین‌نشده",
        status: "در حال انجام"
      },
      {
        id: "t2",
        title: "پیش‌نویس پروتکل جمع‌آوری داده",
        assignee: "تعیین‌نشده",
        status: "برای انجام"
      }
    ]);


  return (

    <div>

      {header}

      <main>

        <div
          className="back-link"
          onClick={() =>
            go(
              role === "student"
                ? "myApplications"
                : "professorDashboard"
            )
          }
        >
          → بازگشت
        </div>


        <div className="page-intro">

          <div>

            <h1 className="page-title">
              {project?.title} — فضای کار
            </h1>

          </div>

        </div>


        <div className="content-grid">

          <div className="left-column">

            <section className="panel">

              <div className="panel-head">

                <div className="panel-title">
                  وظایف
                </div>

              </div>


              <div className="panel-body">

                {
                  tasks.map((t) => (

                    <div
                      key={t.id}
                      className="task-row"
                    >

                      <div>

                        <div className="task-title">
                          {t.title}
                        </div>

                        <div className="task-assignee">
                          محول‌شده به {t.assignee}
                        </div>

                      </div>


                      <select
                        value={t.status}
                        onChange={(e) =>
                          setTasks(
                            tasks.map(
                              (x) =>
                                x.id === t.id
                                  ? {
                                      ...x,
                                      status:
                                        e.target.value
                                    }
                                  : x
                            )
                          )
                        }
                        style={{
                          width: 150,
                          border:
                            "1px solid var(--color-border)",
                          borderRadius:
                            "var(--radius-sm)",
                          padding:
                            ".5rem .6rem",
                          background:
                            "var(--color-surface-soft)"
                        }}
                      >

                        {
                          [
                            "برای انجام",
                            "در حال انجام",
                            "انجام‌شده"
                          ].map(
                            (s) => (

                              <option
                                key={s}
                                value={s}
                              >
                                {s}
                              </option>

                            )
                          )
                        }

                      </select>

                    </div>

                  ))
                }

              </div>

            </section>

          </div>


          <aside className="right-column">

            <section className="panel">

              <div className="panel-head">

                <div className="panel-title">
                  اعضا
                </div>

              </div>


              <div className="panel-body">

                <div className="member-row">

                  <span className="avatar">
                    {professor?.name?.[4]}
                  </span>

                  {professor?.name} — استاد

                </div>


                {
                  members.map(
                    (m) =>
                      m && (

                        <div
                          key={m.id}
                          className="member-row"
                        >

                          <span className="avatar">
                            {m.name[0]}
                          </span>

                          {m.name} — دانشجو

                        </div>

                      )
                  )
                }

              </div>

            </section>


            <section className="panel">

              <div className="panel-head">

                <div className="panel-title">
                  مرور کلی
                </div>

              </div>


              <div className="panel-body">

                <p
                  style={{
                    fontSize: 13,
                    color:
                      "var(--color-text-secondary)",
                    lineHeight: 1.8
                  }}
                >
                  {project?.description}
                </p>

              </div>

            </section>

          </aside>

        </div>

      </main>

    </div>

  );
}


/* =========================================================
   Main App
   ========================================================= */

function ResearchLink() {

  const [route, setRoute] =
    useState({
      page: "landing"
    });


  const [role, setRole] =
    useState(null);


  const [currentUserId, setCurrentUserId] =
    useState(null);


  const [students, setStudents] =
    useState(seedStudents);


  const [professors] =
    useState(seedProfessors);


  const [projects, setProjects] =
    useState(seedProjects);


  const [applications, setApplications] =
    useState(seedApplications);


  const currentStudent =
    students.find(
      (s) =>
        s.id === currentUserId
    );


  const currentProfessor =
    professors.find(
      (p) =>
        p.id === currentUserId
    );


  function go(
    page,
    params = {}
  ) {

    setRoute({
      page,
      ...params
    });

    window.scrollTo(
      0,
      0
    );
  }


  function login(
    r,
    id
  ) {

    setRole(r);

    setCurrentUserId(id);

    go(
      r === "student"
        ? "studentDashboard"
        : "professorDashboard"
    );
  }


  function logout() {

    setRole(null);

    setCurrentUserId(null);

    go("landing");
  }


  function createStudent(profile) {

    const id =
      "s" +
      (students.length + 1) +
      "_" +
      Date.now();


    const student = {
      id,
      ...profile
    };


    setStudents(
      (prev) => [
        ...prev,
        student
      ]
    );


    login(
      "student",
      id
    );
  }


  function createProject(data) {

    const id =
      "pr" +
      (projects.length + 1) +
      "_" +
      Date.now();


    setProjects(
      (prev) => [
        ...prev,
        {
          id,
          status: "باز",
          ...data
        }
      ]
    );


    go(
      "professorDashboard"
    );
  }


  function applyToProject(
    projectId,
    message
  ) {

    const id =
      "a" +
      (applications.length + 1) +
      "_" +
      Date.now();


    setApplications(
      (prev) => [
        ...prev,
        {
          id,
          projectId,
          studentId:
            currentUserId,
          status:
            "ارسال‌شده",
          message,
          createdAt:
            "امروز"
        }
      ]
    );
  }


  function setApplicationStatus(
    appId,
    status
  ) {

    setApplications(
      (prev) =>
        prev.map(
          (a) =>
            a.id === appId
              ? {
                  ...a,
                  status
                }
              : a
        )
    );
  }


  const studentNav = [
    {
      page: "studentDashboard",
      label: "پیشخوان"
    },
    {
      page: "myApplications",
      label: "درخواست‌های من"
    }
  ];


  const professorNav = [
    {
      page: "professorDashboard",
      label: "پروژه‌های من"
    },
    {
      page: "createProject",
      label: "ایجاد پروژه"
    }
  ];


  const header =
    role && (

      <AppHeader
        go={go}
        role={role}
        currentUser={
          role === "student"
            ? currentStudent
            : currentProfessor
        }
        navItems={
          role === "student"
            ? studentNav
            : professorNav
        }
        activePage={
          route.page
        }
        logout={logout}
      />

    );


  switch (route.page) {

    case "landing":

      return (
        <Landing
          go={go}
        />
      );


    case "auth":

      return (
        <AuthScreen
          go={go}
          initialRole={
            route.role
          }
          onLogin={login}
          students={students}
          professors={professors}
        />
      );


    case "onboarding":

      return (
        <Onboarding
          go={go}
          onCreate={
            createStudent
          }
        />
      );


    case "studentDashboard":

      return currentStudent
        ? (
            <StudentDashboard
              go={go}
              header={header}
              student={
                currentStudent
              }
              projects={
                projects
              }
              professors={
                professors
              }
            />
          )
        : (
            <Landing
              go={go}
            />
          );


    case "projectDetails":

      return (
        <ProjectDetails
          go={go}
          header={
            header ||
            <AppHeader
              go={go}
              role={null}
              currentUser={null}
              navItems={[]}
              activePage={
                route.page
              }
              logout={logout}
            />
          }
          projectId={
            route.projectId
          }
          projects={
            projects
          }
          professors={
            professors
          }
          student={
            currentStudent
          }
          applications={
            applications
          }
          onApply={
            applyToProject
          }
        />
      );


    case "myApplications":

      return currentStudent
        ? (
            <MyApplications
              go={go}
              header={header}
              student={
                currentStudent
              }
              applications={
                applications
              }
              projects={
                projects
              }
              professors={
                professors
              }
            />
          )
        : (
            <Landing
              go={go}
            />
          );


    case "professorDashboard":

      return currentProfessor
        ? (
            <ProfessorDashboard
              go={go}
              header={header}
              professor={
                currentProfessor
              }
              projects={
                projects
              }
              applications={
                applications
              }
            />
          )
        : (
            <Landing
              go={go}
            />
          );


    case "createProject":

      return currentProfessor
        ? (
            <CreateProject
              go={go}
              header={header}
              professor={
                currentProfessor
              }
              onCreate={
                createProject
              }
            />
          )
        : (
            <Landing
              go={go}
            />
          );


    case "projectApplicants":

      return currentProfessor
        ? (
            <ProjectApplicants
              go={go}
              header={header}
              projectId={
                route.projectId
              }
              projects={
                projects
              }
              applications={
                applications
              }
              students={
                students
              }
              onStatus={
                setApplicationStatus
              }
            />
          )
        : (
            <Landing
              go={go}
            />
          );


    case "workspace":

      return (
        <Workspace
          go={go}
          header={header}
          projectId={
            route.projectId
          }
          projects={
            projects
          }
          professors={
            professors
          }
          students={
            students
          }
          applications={
            applications
          }
          role={role}
        />
      );


    default:

      return (
        <Landing
          go={go}
        />
      );

  }

}


/* =========================================================
   Mount React
   ========================================================= */

try {

  ReactDOM
    .createRoot(
      document.getElementById(
        'root'
      )
    )
    .render(
      <ResearchLink />
    );


  window.__RL_MOUNTED__ = true;

} catch (err) {

  var box =
    document.getElementById(
      'error-box'
    );

  box.style.display =
    'block';

  box.textContent =
    'خطای React: ' +
    err.message +
    '\n' +
    (err.stack || '');

}

</script>

</body>
</html>
